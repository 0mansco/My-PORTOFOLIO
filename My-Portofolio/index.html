<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <title>My Portofolio</title>
  </head>
  <body>
    <!-- Start Header -->
    <div class="container">
      <header>
        <div class="header">
          <h2><span>F</span>.Rohman</h2>
          <input type="checkbox" id="menu-toggle" class="menu-toggle" />
          <label for="menu-toggle" class="hamburger">
            <span></span>
            <span></span>
            <span></span>
          </label>
          <nav class="navbar">
            <a href="#about">About</a>
            <a href="#project">Project</a>
            <a href="#contact">Contact</a>
          </nav>
        </div>
      </header>

      <!-- Start Main -->
      <main>
        <section class="hero-section">
          <h1>Welcome To Website 🌐</h1>
          <p class="heading">Building Website</p>
          <h2>Junior Fullstack Developer</h2>
          <div class="skill">
            <button type="button" id="#navbar">Experience</button>
          </div>
          <div class="hero-section-01">
            <div class="intro-text">
              <p>
                I m a passionate web developer who enjoys creating clean,
                responsive, and user-friendly websites. I m always eager to
                learn new technologies and turn ideas into meaningful digital
                experiences.
              </p>
            </div>
            <div class="profil-card">
              <figure>
                <img src="asset/robot.jpg" class="figured" alt="photo-profil-rohman" />
                <figcaption>Junior Developer</figcaption>
              </figure>
            </div>
          </div>
        </section>

        <section class="section-project"></section>
      </main>
    </div>
  </body>
</html>
